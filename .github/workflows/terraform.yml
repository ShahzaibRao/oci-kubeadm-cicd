# ============================================================
# WHAT: Terraform CI — infra ka GitOps pipeline.
# WHY:  Laptop se `terraform apply` production style nahi:
#       - PR par plan CI mein chalta hai, output PR comment mein
#         aata hai (merge se pehle nazar aata hai kya banega)
#       - main par merge ke baad apply KHUD chalta hai (koi manual
#         approval nahi — 2026-10-15 se environment gate hata diya;
#         PR review hi approval hai)
#       - State R2 mein, secrets GitHub Secrets mein
#       - Recruiter ko poora audit trail GitHub mein nazar aata hai:
#         kaunsi PR ne kaunsa infra banaya
# HOW:  PR #4 (R2 backend) merge ke baad hi ye workflow kaam
#       karega — versions.tf mein backend "s3" zaroori hai.
# ============================================================
name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

# WHY: capacity-hunter workflow ke saath overlap na ho — state lock
# contention se bachne ke liye dono ek hi group mein queue hote hain.
concurrency:
  group: oci-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # R2 backend credentials — env se, kabhi file mein nahi
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # OCI provider auth — env se, runner par ~/.oci/config nahi hota
  OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
  OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
  OCI_REGION: ${{ secrets.OCI_REGION }}
  # Terraform variables — TF_VAR_* env vars variables.tf se map hote hain
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
  # NOTE: TF_VAR_admin_cidr abhi default (0.0.0.0/0) par hai.
  # Lockdown ke waqt secret banao aur ye line uncomment karo:
  # TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      # Pinned SHAs — WHY: supply-chain security. Tag move ho sakta
      # hai, SHA nahi. Har action ka version comment mein likha hai.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"

      - name: Init (R2 backend)
        # WHY backend.hcl file, CLI flags kyun nahi: -backend-config="k=v"
        # flags nested blocks (endpoints { s3 = ... }) express nahi kar
        # sakte — is liye file banao aur -backend-config=backend.hcl do.
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate-kubeadm-cicd"
          key    = "oci-kubeadm-cicd/terraform.tfstate"
          region = "auto"
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          skip_credentials_validation = true
          skip_metadata_api_check      = true
          skip_region_validation       = true
          skip_requesting_account_id   = true
          use_lockfile                 = true
          EOF
          terraform init -backend-config=backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/tfplan
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`.slice(0, 60000);
            const body = `## Terraform Plan\n<details><summary>Click to expand</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply
    # WHY sirf push par: PR par sirf plan, apply sirf main par.
    # NOTE: `environment: production` gate hata diya (2026-10-15) —
    # capacity hunt ke liye har apply par manual approval toil tha.
    # Ab PR review hi approval hai (single-person project).
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"

      - name: Init (R2 backend)
        # WHY backend.hcl file, CLI flags kyun nahi: -backend-config="k=v"
        # flags nested blocks (endpoints { s3 = ... }) express nahi kar
        # sakte — is liye file banao aur -backend-config=backend.hcl do.
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate-kubeadm-cicd"
          key    = "oci-kubeadm-cicd/terraform.tfstate"
          region = "auto"
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          skip_credentials_validation = true
          skip_metadata_api_check      = true
          skip_region_validation       = true
          skip_requesting_account_id   = true
          use_lockfile                 = true
          EOF
          terraform init -backend-config=backend.hcl

      # WHY yahan dobara plan banta hai (reviewed artifact nahi):
      # AD hunt ke liye har attempt par ad_index badalta hai
      # (-var="ad_index=N"), is liye ek fixed tfplan kaam nahi karta.
      # Farq SIRF ad_index ka hai — baaki config wahi jo PR par review hui.
      # Kamyab AD milne ke baad usay variables.tf default mein lock karna
      # (follow-up PR) taake future plan/apply mein drift/recreate na ho.
      - name: Apply with capacity hunt (3 AD × 3 FD = 9 combos)
        run: |
          SUCCESS=false
          WINNER=""
          for AD in 0 1 2; do
            for FD in 1 2 3; do
              echo "=== AD-$AD / FD-$FD try ho raha hai ==="
              set +e
              OUTPUT=$(terraform apply -input=false -auto-approve -var="ad_index=$AD" -var="fault_domain=FAULT-DOMAIN-$FD" 2>&1)
              CODE=$?
              set -e
              echo "$OUTPUT" | tail -8
              if [ "$CODE" -eq 0 ]; then
                echo "VM ban gayi: AD-$AD FD-$FD"
                SUCCESS=true
                WINNER="ad_index=$AD fault_domain=FAULT-DOMAIN-$FD"
                break 2
              fi
              if echo "$OUTPUT" | grep -q "Out of host capacity"; then
                echo "Full — agla combo"
                continue
              fi
              echo "Capacity ka masla NAHI — asal error, fail fast:"
              echo "$OUTPUT" | grep -B2 -A10 "Error" | head -40
              exit 1
            done
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "9 combos sab full — kuch ghanton baad 'Re-run failed jobs' dabao."
            exit 1
          fi
          echo "--- Winner: $WINNER (follow-up PR mein default lock karna) ---"
          echo "--- Outputs (IPs) ---"
          terraform output
